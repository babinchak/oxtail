[package]
name = "oxtail"
version = "0.1.0"
edition = "2024"
description = "A tail for NDJSON logs with a friendly TUI (plain text works too)"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
ratatui = "0.29"
serde_json = { version = "1", features = ["preserve_order"] }
